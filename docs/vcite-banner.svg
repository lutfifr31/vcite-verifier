      <line x1="864" y1="175" x2="900" y2="175" stroke="#10b981" stroke-width="2.5" class="stream-line" />

      
      <rect x="900" y="132" width="222" height="86" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" />
