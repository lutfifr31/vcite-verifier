    </text>
  </g>

  

  
  <rect x="615" y="44" width="535" height="332" rx="16" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.6" />

  
  <path d="M 615 60 Q 615 44 631 44 L 1134 44 Q 1150 44 1150 60 L 1150 84 L 615 84 Z" fill="#131c31" />
  <line x1="615" y1="84" x2="1150" y2="84" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="639" cy="64" r="5" fill="#f43f5e" />
  <circle cx="657" cy="64" r="5" fill="#facc15" />
  <circle cx="675" cy="64" r="5" fill="#10b981" />
  <text x="698" y="68" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">
    VCITE_VERIFIER // LIVE STATE TRANSITION
  </text>
  <circle cx="1126" cy="64" r="4.5" fill="#38bdf8" class="live-dot" />

  
