  </g>

  
  <g class="enter-3">
    <rect x="74" y="224" width="490" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.4" />
    <rect x="74" y="224" width="6" height="50" rx="3" fill="#38bdf8" />
    <text x="98" y="256" fill="#f8fafc" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-size="22.5" font-weight="700" letter-spacing="0.4">
