<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#070d1a" />
    </linearGradient>

    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11192c" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>

    
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9" />
    </linearGradient>

    
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    
    <clipPath id="panelClip">
      <rect x="615" y="44" width="535" height="332" rx="16" />
    </clipPath>

    <clipPath id="titleClip">
      <text x="72" y="198" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="6">VCITE</text>
    </clipPath>

    <style>
      /* ===== ENTRANCE TRANSITIONS ===== */
      @keyframes slideInRight {
        0% { opacity: 0; transform: translateX(-28px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes slideInUp {
        0% { opacity: 0; transform: translateY(18px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes titleShimmer {
        0%, 20% { transform: translateX(-160px) skewX(-20deg); }
        55%, 100% { transform: translateX(460px) skewX(-20deg); }
      }

      /* ===== 9-SECOND DUAL-SCENE STATE TRANSITION LOOP ===== */
      /* Scene 1: VERIFIED (0% to 48%) */
      @keyframes sceneOneTransition {
        0%   { opacity: 0; transform: translateX(26px); }
        5%   { opacity: 1; transform: translateX(0px); }
        43%  { opacity: 1; transform: translateX(0px); }
        49%  { opacity: 0; transform: translateX(-26px); }
        100% { opacity: 0; transform: translateX(-26px); }
      }

      /* Scene 2: HALLUCINATION BLOCKED (50% to 98%) */
      @keyframes sceneTwoTransition {
        0%, 49% { opacity: 0; transform: translateX(26px); }
        55%     { opacity: 1; transform: translateX(0px); }
        93%     { opacity: 1; transform: translateX(0px); }
        99%     { opacity: 0; transform: translateX(-26px); }
        100%    { opacity: 0; transform: translateX(26px); }
      }

      /* Laser Scanner Sweep (Runs once per scene: 6%-20% and 56%-70%) */
      @keyframes scannerSweep {
        0%, 5%   { opacity: 0; transform: translateY(88px); }
        8%       { opacity: 1; transform: translateY(88px); }
        20%      { opacity: 1; transform: translateY(255px); }
        23%, 55% { opacity: 0; transform: translateY(255px); }
        58%      { opacity: 1; transform: translateY(88px); }
        70%      { opacity: 1; transform: translateY(255px); }
        73%, 100%{ opacity: 0; transform: translateY(255px); }
      }

      /* Scene 1 Progress Bar Fill (0% -&gt; 100%) */
      @keyframes barFillOne {
        0%, 8%   { width: 0px; }
        22%, 48% { width: 475px; }
        50%, 100%{ width: 0px; }
      }

      /* Scene 2 Progress Bar Fill (0% -&gt; 86% lexical match) */
      @keyframes barFillTwo {
        0%, 58%  { width: 0px; }
        72%, 98% { width: 408px; }
        100%     { width: 0px; }
      }

      /* Verdict Pop-In Transition after Scan Completes */
      @keyframes verdictPopOne {
        0%, 19%  { opacity: 0; transform: scale(0.88) translateY(8px); }
        24%, 44% { opacity: 1; transform: scale(1) translateY(0px); }
        49%, 100%{ opacity: 0; transform: scale(0.95); }
      }

      @keyframes verdictPopTwo {
        0%, 69%  { opacity: 0; transform: scale(0.88) translateY(8px); }
        73%      { opacity: 1; transform: scale(1.03) translateY(0px); }
        76%, 94% { opacity: 1; transform: scale(1) translateY(0px); }
        99%, 100%{ opacity: 0; transform: scale(0.95); }
      }

      /* Flowing Connector Dots */
      @keyframes dataStream {
        to { stroke-dashoffset: -28; }
      }

      @keyframes pulseLive {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      .enter-1 { animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .enter-2 { animation: slideInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .enter-3 { animation: slideInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
      .enter-4 { animation: slideInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }

      .shimmer-rect { animation: titleShimmer 4.5s ease-in-out infinite; }
      .scene-1 { animation: sceneOneTransition 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .scene-2 { animation: sceneTwoTransition 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .scanner { animation: scannerSweep 9s ease-in-out infinite; }
      .bar-1 { animation: barFillOne 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .bar-2 { animation: barFillTwo 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .verdict-1 { transform-origin: 882px 324px; animation: verdictPopOne 9s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
      .verdict-2 { transform-origin: 882px 324px; animation: verdictPopTwo 9s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
      .stream-line { stroke-dasharray: 7 7; animation: dataStream 0.9s linear infinite; }
      .live-dot { animation: pulseLive 1.5s ease-in-out infinite; }
    </style>
  </defs>

  
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  
  <path d="M 28 64 L 28 36 Q 28 22 42 22 L 76 22" fill="none" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" filter="url(#goldGlow)" />
  <path d="M 28 356 L 28 384 Q 28 398 42 398 L 76 398" fill="none" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" filter="url(#goldGlow)" />
  <path d="M 1124 22 L 1158 22 Q 1172 22 1172 36 L 1172 64" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanGlow)" />
  <path d="M 1124 398 L 1158 398 Q 1172 398 1172 384 L 1172 356" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#cyanGlow)" />

  

  
  <g class="enter-1">
    <rect x="74" y="56" width="386" height="34" rx="17" fill="#111827" stroke="#eab308" stroke-width="1.3" />
    <circle cx="94" cy="73" r="5" fill="#facc15" class="live-dot" />
    <text x="110" y="78" fill="#fde047" font-family="Consolas, monospace" font-size="13.5" font-weight="700" letter-spacing="1.1">
